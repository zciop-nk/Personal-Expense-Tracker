{% load static %}
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}씀 / SSEUM{% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'expenses/images/favicon-sseum.png' %}">
    <link rel="apple-touch-icon" href="{% static 'expenses/images/favicon-sseum.png' %}">

    <link rel="stylesheet" href="{% static 'expenses/css/style.css' %}">
    
    <!-- 공통 모달 -->
    <div class="app-modal" id="appModal" hidden aria-hidden="true">
        <div class="app-modal-backdrop" data-modal-close></div>
        <div class="app-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="appModalTitle">
            <button type="button" class="app-modal-close" id="appModalClose" aria-label="닫기"> × </button>
            <div class="app-modal-content">
                <div class="app-modal-title" id="appModalTitle">
                    확인이 필요해요
                </div>
                <div class="app-modal-message" id="appModalMessage"></div>
            </div>
            <div class="app-modal-actions">
                <button type="button" class="app-modal-button app-modal-button-secondary" id="appModalCancel"> 취소 </button>
                <button type="button" class="app-modal-button app-modal-button-danger" id="appModalConfirm"> 확인 </button>
            </div>
        </div>
    </div>
    <script src="{% static 'expenses/js/main.js' %}" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="page-shell header-inner">
            <a class="brand" href="{% url 'expense_list' %}" aria-label="씀 SSEUM 홈">
                <img class="brand-logo" src="{% static 'expenses/images/logo-sseum-horizontal.png' %}" alt="씀 SSEUM">
            </a>

            <a class="primary-button compact" href="{% url 'expense_create' %}">
                + 지출 추가
            </a>
        </div>
    </header>

    <main class="page-shell main-content">
        {% if messages %}
            <div class="flash-stack">
                {% for message in messages %}
                    <div class="flash {% if message.tags %}{{ message.tags }}{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
